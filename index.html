<style>
  body {

    padding: 0;

    justify-content: center;
    align-items: center;
    height: 100vh;

  }

    letter-spacing: 1px;
  }

  ul {
    list-style: none;

  li {
    margin: 12px 0;
  }

  a {
    display: block;
    padding: 14px;

    border-radius: 10px;

  a:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: translateY(-3px);
